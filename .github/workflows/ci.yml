# Vérifications à chaque push et à chaque PR : lint, types, tests, build.
#
# Aucun secret : le build passe sans aucune variable d'environnement (vérifié le
# 2026-11-07 sans .env.local). Si un jour il en exige une, c'est un défaut à corriger
# dans le code (lecture à la requête, pas au build), pas une variable à ajouter ici.
#
# La CI ne déploie rien : c'est l'intégration GitHub de Vercel qui déploie `main`.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: lint + types + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Tout l'historique : garde-commit contrôle chaque commit depuis la base.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # Le lock référence le socle (dépôt public) en git+ssh ; sans clé SSH sur le
      # runner, on force HTTPS au cas où npm ne passerait pas par l'archive codeload.
      - name: Socle en HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - run: npm ci

      # Garde-fou du socle (v3.35.0), commit par commit : export de réservations, fichier
      # ignoré ajouté de force, .env, secret de format connu. Il DÉTECTE seulement : le dépôt
      # est public, un échec veut dire que c'est déjà en ligne — prévenir l'hôte (rotation ou
      # purge, voir la fiche RGPD). Les références passent par env:, jamais dans run:.
      - name: garde-commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          DEFAUT: origin/${{ github.event.repository.default_branch }}
        run: |
          # Premier push d'une branche (before = zéros) ou force-push (before introuvable) : depuis la branche par défaut.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="$DEFAUT"; fi
          node node_modules/@sejour/socle/scripts/garde-commit.mjs --depuis "$BASE"

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
